<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gunpla Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-name" href="{{ url_for('kit_list') }}">Gunpla Tracker</a>
            {% if session.get('logged_in') %}
            <nav>
                <a href="{{ url_for('kit_list') }}" {% if request.path=='/' or request.path.startswith('/kits')
                    %}aria-current="page" {% endif %}>Kits</a>
                <a href="{{ url_for('paint_list') }}" {% if request.path.startswith('/paints') %}aria-current="page" {%
                    endif %}>Paints</a>
                <a href="{{ url_for('tool_list') }}" {% if request.path.startswith('/tools') %}aria-current="page" {%
                    endif %}>Tools</a>
                <a href="{{ url_for('tool_list') }}" ...>Tools</a>
                <form method="post" action="{{ url_for('logout') }}" class="logout-form">
                    <button type="submit">Log out</button>
                </form>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
